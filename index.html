<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Kasir POS</h1>
    </header>
    <main>
        <section id="produk">
            <h2>Daftar Produk</h2>
            <div class="produk-item">
                <h3>Produk 1</h3>
                <p>Harga: Rp 10.000</p>
                <button onclick="tambahKeKeranjang('Produk 1', 10000)">Tambah ke Keranjang</button>
            </div>
            <div class="produk-item">
                <h3>Produk 2</h3>
                <p>Harga: Rp 20.000</p>
                <button onclick="tambahKeKeranjang('Produk 2', 20000)">Tambah ke Keranjang</button>
            </div>
            <!-- Tambahkan lebih banyak produk sesuai kebutuhan -->
        </section>
        
        <section id="keranjang">
            <h2>Keranjang Belanja</h2>
            <ul id="daftar-keranjang"></ul>
            <p>Total: Rp <span id="total-harga">0</span></p>
            <button onclick="prosesPembayaran()">Proses Pembayaran</button>
        </section>
    </main>

    <footer>
        <p>© 2026 Kasir POS. Semua hak dilindungi.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
